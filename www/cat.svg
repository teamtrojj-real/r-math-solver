<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="Кот-маскот Финик">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a54a"/>
      <stop offset="1" stop-color="#e8862a"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e0a800"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="160" cy="342" rx="105" ry="12" fill="#0b2545" opacity=".15"/>

  <!-- tail -->
  <path d="M236 300 C300 290 304 220 270 205" fill="none" stroke="#e8862a" stroke-width="20" stroke-linecap="round"/>
  <path d="M276 214 C284 222 286 230 284 238" fill="none" stroke="#c96a16" stroke-width="6" stroke-linecap="round"/>

  <!-- body -->
  <path d="M90 330 C80 260 100 205 160 205 C220 205 240 260 230 330 Z" fill="url(#fur)"/>
  <!-- belly -->
  <path d="M125 330 C120 280 135 248 160 248 C185 248 200 280 195 330 Z" fill="#fde4c4"/>

  <!-- jacket (navy) -->
  <path d="M92 330 C84 270 104 222 135 212 L160 270 L185 212 C216 222 236 270 228 330 Z" fill="#13315c"/>
  <!-- shirt + tie -->
  <path d="M140 214 L160 270 L180 214 Z" fill="#ffffff"/>
  <path d="M154 222 L166 222 L163 232 L170 262 L160 274 L150 262 L157 232 Z" fill="#e0a800"/>
  <!-- lapel pin -->
  <circle cx="200" cy="250" r="5" fill="#e0a800"/>

  <!-- feet -->
  <ellipse cx="128" cy="333" rx="24" ry="11" fill="#f6a54a"/>
  <ellipse cx="192" cy="333" rx="24" ry="11" fill="#f6a54a"/>

  <!-- arm holding coin -->
  <path d="M222 250 C246 248 256 232 252 214" fill="none" stroke="#13315c" stroke-width="22" stroke-linecap="round"/>
  <circle cx="252" cy="206" r="13" fill="#f6a54a"/>
  <!-- coin with R -->
  <g transform="translate(252 168)">
    <circle r="30" fill="url(#coin)" stroke="#b88600" stroke-width="4"/>
    <circle r="22" fill="none" stroke="#b88600" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="0" y="11" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#7a5600">R</text>
  </g>

  <!-- other arm -->
  <path d="M98 250 C86 268 88 290 100 300" fill="none" stroke="#13315c" stroke-width="22" stroke-linecap="round"/>
  <circle cx="104" cy="304" r="12" fill="#f6a54a"/>

  <!-- head -->
  <g>
    <!-- ears -->
    <path d="M78 92 L92 20 L146 66 Z" fill="#e8862a"/>
    <path d="M94 80 L101 40 L130 66 Z" fill="#fbb6b6"/>
    <path d="M242 92 L228 20 L174 66 Z" fill="#e8862a"/>
    <path d="M226 80 L219 40 L190 66 Z" fill="#fbb6b6"/>

    <ellipse cx="160" cy="130" rx="96" ry="86" fill="url(#fur)"/>
    <!-- stripes -->
    <path d="M160 46 L160 76" stroke="#c96a16" stroke-width="8" stroke-linecap="round"/>
    <path d="M136 50 L142 74" stroke="#c96a16" stroke-width="7" stroke-linecap="round"/>
    <path d="M184 50 L178 74" stroke="#c96a16" stroke-width="7" stroke-linecap="round"/>
    <path d="M66 120 L90 124" stroke="#c96a16" stroke-width="7" stroke-linecap="round"/>
    <path d="M254 120 L230 124" stroke="#c96a16" stroke-width="7" stroke-linecap="round"/>

    <!-- muzzle -->
    <ellipse cx="160" cy="162" rx="50" ry="36" fill="#fde4c4"/>

    <!-- glasses -->
    <g fill="#ffffff" fill-opacity=".35" stroke="#0b2545" stroke-width="5">
      <circle cx="122" cy="124" r="26"/>
      <circle cx="198" cy="124" r="26"/>
    </g>
    <path d="M148 122 Q160 114 172 122" fill="none" stroke="#0b2545" stroke-width="5"/>

    <!-- eyes -->
    <ellipse cx="122" cy="126" rx="11" ry="14" fill="#0b2545"/>
    <ellipse cx="198" cy="126" rx="11" ry="14" fill="#0b2545"/>
    <circle cx="126" cy="120" r="4.5" fill="#ffffff"/>
    <circle cx="202" cy="120" r="4.5" fill="#ffffff"/>

    <!-- nose & mouth -->
    <path d="M151 152 L169 152 L160 162 Z" fill="#e7707b"/>
    <path d="M160 162 Q160 174 146 176" fill="none" stroke="#0b2545" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 162 Q160 174 174 176" fill="none" stroke="#0b2545" stroke-width="4" stroke-linecap="round"/>

    <!-- cheeks -->
    <ellipse cx="104" cy="164" rx="12" ry="7" fill="#f28c8c" opacity=".55"/>
    <ellipse cx="216" cy="164" rx="12" ry="7" fill="#f28c8c" opacity=".55"/>

    <!-- whiskers -->
    <g stroke="#7a4a1a" stroke-width="2.5" stroke-linecap="round">
      <path d="M118 160 L74 152"/>
      <path d="M118 168 L72 170"/>
      <path d="M202 160 L246 152"/>
      <path d="M202 168 L248 170"/>
    </g>
  </g>

  <!-- graduation cap -->
  <g>
    <path d="M100 52 L160 26 L220 52 L160 78 Z" fill="#0b2545"/>
    <path d="M124 62 L124 80 C140 92 180 92 196 80 L196 62 L160 78 Z" fill="#13315c"/>
    <path d="M206 58 L206 92" stroke="#e0a800" stroke-width="4"/>
    <circle cx="206" cy="96" r="6" fill="#e0a800"/>
  </g>
</svg>
